name: Image

# Publishes the server image to GHCR. The server is released with its own
# tags, apart from the CLI's (release.yml):
#
# - A server tag, server-v0.1.0 or server-v0.1.0-rc.1, publishes:
#     ghcr.io/<owner>/stashvent-server:server-v0.1.0  the tag itself; never moves
#     ghcr.io/<owner>/stashvent-server:<commit sha>   never moves
#     ghcr.io/<owner>/stashvent-server:latest         final versions only, not -rc
#
# - By hand (Actions → Image → Run workflow), on main only, for builds between
#   releases:
#     ghcr.io/<owner>/stashvent-server:<commit sha>   every run, never moves
#     ghcr.io/<owner>/stashvent-server:main           moves to the latest run
#
# Either way the tests run first: a tag push doesn't run CI.

on:
  workflow_dispatch:
  push:
    tags: ["server-v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# One queue per tag or branch: GitHub keeps only one waiting run per group, so
# a shared group would let a later run drop a waiting release.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The image is the server on Linux, so the tests run there, as in ci.yml's
  # Linux job.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # A run by hand builds main: on another branch it would publish code that
      # was never merged, and on a server tag it would rebuild a released image
      # under the same tag.
      - name: Main only, when run by hand
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on main. A server release is a pushed server-v… tag (RELEASES.md)."
          exit 1
      # A tag becomes an image tag, and its suffix decides :latest, so only
      # server-v<major>.<minor>.<patch>[-<pre-release>] is published.
      - name: Server tag
        if: github.ref_type == 'tag'
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^server-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::$GITHUB_REF_NAME isn't a server tag such as server-v0.1.0 or server-v0.1.0-rc.1"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: go vet ./...
      - name: Test (with race detector)
        run: go test -race ./...

  publish:
    name: Build and push the server image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # GHCR names must be lowercase. A release is versioned by its tag
      # (server-v0.1.0, checked by the test job); a build by hand by its commit.
      - name: Image name and tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/stashvent-server"
          tags="$image:$GITHUB_SHA"
          version="$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
            tags="$tags $image:$version"
            # Judged without the server- prefix, which always has a hyphen.
            case "${version#server-}" in
              *-*) ;; # a pre-release (server-v0.1.0-rc.1) never moves latest
              *) tags="$tags $image:latest" ;;
            esac
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            tags="$tags $image:main"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAGS=$tags" >> "$GITHUB_ENV"
          echo "Publishing: $tags"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: |
          args=()
          for t in $TAGS; do args+=(-t "$t"); done
          docker build -f deploy/docker/server.Dockerfile --build-arg VERSION="$VERSION" "${args[@]}" .
      - name: Push
        run: for t in $TAGS; do docker push "$t"; done
